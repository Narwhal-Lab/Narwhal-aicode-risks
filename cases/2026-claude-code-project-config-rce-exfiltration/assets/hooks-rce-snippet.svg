<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code hook configuration risk</title>
  <desc id="desc">A code-style figure showing a safe redacted Claude Code hook configuration and the security boundary it crosses.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .side { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.3; rx: 12; }
      .mono { font-family: "DejaVu Sans Mono", Consolas, monospace; fill: #e5e7eb; font-size: 17px; }
      .key { fill: #93c5fd; }
      .str { fill: #86efac; }
      .warn { fill: #fbbf24; }
      .txt { font-family: Arial, "Noto Sans SC", sans-serif; fill: #0f172a; font-size: 17px; }
      .small { font-family: Arial, "Noto Sans SC", sans-serif; fill: #475569; font-size: 14px; }
      .title { font-family: Arial, "Noto Sans SC", sans-serif; fill: #f8fafc; font-size: 22px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="980" height="500"/>
  <text x="36" y="42" class="title">Hooks 风险示例：配置文件控制本地命令</text>
  <text x="36" y="68" fill="#cbd5e1" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15">示例命令已脱敏，只展示执行入口与风险边界。</text>

  <rect x="36" y="100" width="590" height="350" class="card"/>
  <text x="64" y="138" class="mono">{</text>
  <text x="86" y="168" class="mono"><tspan class="key">"hooks"</tspan>: {</text>
  <text x="108" y="198" class="mono"><tspan class="key">"SessionStart"</tspan>: [</text>
  <text x="130" y="228" class="mono">{ <tspan class="key">"matcher"</tspan>: <tspan class="str">"startup"</tspan>,</text>
  <text x="152" y="258" class="mono"><tspan class="key">"hooks"</tspan>: [</text>
  <text x="174" y="288" class="mono">{</text>
  <text x="196" y="318" class="mono"><tspan class="key">"type"</tspan>: <tspan class="str">"command"</tspan>,</text>
  <text x="196" y="348" class="mono"><tspan class="key">"command"</tspan>: <tspan class="str">"bash -lc 'printf ...'"</tspan></text>
  <text x="174" y="378" class="mono">}</text>
  <text x="152" y="408" class="mono">]</text>
  <text x="130" y="438" class="mono">}</text>

  <rect x="670" y="100" width="270" height="350" class="side"/>
  <text x="696" y="140" class="txt" font-weight="700">安全含义</text>
  <text x="696" y="180" class="small">1. Hook 来自仓库内容</text>
  <text x="696" y="210" class="small">2. 执行位置是开发者本机</text>
  <text x="696" y="240" class="small">3. 命令可访问工作区文件</text>
  <text x="696" y="270" class="small">4. 若无二次确认，风险被隐藏</text>
  <rect x="696" y="318" width="212" height="78" fill="#fff7ed" stroke="#fb923c" rx="8"/>
  <text x="714" y="348" class="txt" fill="#9a3412" font-weight="700">审查要点</text>
  <text x="714" y="373" class="small">把 .claude/ 当作代码审查</text>
</svg>
