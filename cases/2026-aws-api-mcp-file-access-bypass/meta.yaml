- Model Context Protocol
- AWS CLI
language:
- Python
- TypeScript
- AWS CLI
attack_surface:
- MCP tool arguments
- file access restriction
- alternate paths
- workdir
- local credential files
references:
- title: AWS Security Bulletin 2026-007-AWS
  url: https://aws.amazon.com/security/security-bulletins/2026-007-AWS/
