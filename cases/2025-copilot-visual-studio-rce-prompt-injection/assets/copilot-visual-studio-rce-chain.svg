<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Copilot Visual Studio RCE attack chain</title>
  <desc id="desc">A four-stage diagram showing prompt injection, workspace setting modification, auto approval, and command execution.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 10; }
      .risk { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.6; rx: 10; }
      .bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.6; rx: 10; }
      .txt { font-family: Arial, "Noto Sans SC", sans-serif; fill: #0f172a; font-size: 18px; }
      .small { font-family: Arial, "Noto Sans SC", sans-serif; fill: #475569; font-size: 14px; }
      .num { font-family: Arial, "Noto Sans SC", sans-serif; fill: #ffffff; font-size: 18px; font-weight: 700; }
      .line { stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="430"/>
  <text x="36" y="45" class="txt" font-weight="700">CVE-2025-53773 攻击链</text>
  <text x="36" y="70" class="small">提示词注入不直接运行代码，而是先改写 IDE 和 Copilot 的执行策略。</text>

  <rect x="42" y="120" width="190" height="150" class="panel"/>
  <circle cx="70" cy="146" r="16" fill="#2563eb"/><text x="65" y="152" class="num">1</text>
  <text x="94" y="150" class="txt" font-weight="700">投递指令</text>
  <text x="64" y="188" class="small">README、源码注释</text>
  <text x="64" y="213" class="small">issue、网页、MCP 返回值</text>
  <text x="64" y="238" class="small">被 Copilot 作为上下文读取</text>

  <rect x="282" y="120" width="190" height="150" class="risk"/>
  <circle cx="310" cy="146" r="16" fill="#ea580c"/><text x="305" y="152" class="num">2</text>
  <text x="334" y="150" class="txt" font-weight="700">写入配置</text>
  <text x="304" y="188" class="small">修改 .vscode/settings.json</text>
  <text x="304" y="213" class="small">改变 agent 命令批准策略</text>
  <text x="304" y="238" class="small">配置变成执行边界</text>

  <rect x="522" y="120" width="190" height="150" class="risk"/>
  <circle cx="550" cy="146" r="16" fill="#ea580c"/><text x="545" y="152" class="num">3</text>
  <text x="574" y="150" class="txt" font-weight="700">自动批准</text>
  <text x="544" y="188" class="small">终端命令无需逐次确认</text>
  <text x="544" y="213" class="small">diff 审查被绕过</text>
  <text x="544" y="238" class="small">用户误以为只是 review</text>

  <rect x="762" y="120" width="176" height="150" class="bad"/>
  <circle cx="790" cy="146" r="16" fill="#dc2626"/><text x="785" y="152" class="num">4</text>
  <text x="814" y="150" class="txt" font-weight="700">命令执行</text>
  <text x="784" y="188" class="small">读取凭据</text>
  <text x="784" y="213" class="small">下载载荷</text>
  <text x="784" y="238" class="small">污染仓库内容</text>

  <path class="line" d="M232 195 H274"/>
  <path class="line" d="M472 195 H514"/>
  <path class="line" d="M712 195 H754"/>

  <rect x="42" y="318" width="896" height="62" fill="#eff6ff" stroke="#bfdbfe" rx="10"/>
  <text x="66" y="345" class="txt" font-weight="700" font-size="15">关键判断</text>
  <text x="66" y="366" class="small">AI 编码助手拥有写文件和调用终端能力时，工作区配置必须按可执行代码处理。</text>
</svg>
