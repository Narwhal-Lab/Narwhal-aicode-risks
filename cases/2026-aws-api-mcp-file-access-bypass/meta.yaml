verification_notes: AWS's security bulletin is the primary source and credits Varonis. NVD, the GitHub advisory, Varonis reporting, and Singapore's bulletin corroborate the affected range and patch. The case does not assume every MCP client automatically exposes all returned file content to a model or user.
