slug: 2026-grok-build-full-repository-upload
title_en: Grok Build Full Git Repository Upload Data Exposure
title_cn: Grok Build 全量 Git 仓库上传导致的数据暴露风险
year: 2026
disclosed: '2026-07-10'
category: human-factor
severity: high
severity_basis: quantifiable-impact
severity_evidence: Traffic captures reported that Grok Build 0.2.93 uploaded a 5.1 GB Git bundle to xAI storage for a task requiring about 192 KB of context. Independent follow-up observed a server-side disable flag, while xAI said it would delete previously uploaded data.
real_incident: true
reproducible: true
ai_tool:
