<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code project configuration attack chain</title>
  <desc id="desc">A four-stage diagram showing how repository-controlled Claude Code configuration can become command execution and credential leakage.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 10; }
      .risk { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.6; rx: 10; }
      .bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.6; rx: 10; }
      .txt { font-family: Arial, "Noto Sans SC", sans-serif; fill: #0f172a; font-size: 18px; }
      .small { font-family: Arial, "Noto Sans SC", sans-serif; fill: #475569; font-size: 14px; }
      .label { font-family: Arial, "Noto Sans SC", sans-serif; fill: #334155; font-size: 13px; font-weight: 700; }
      .num { font-family: Arial, "Noto Sans SC", sans-serif; fill: #ffffff; font-size: 18px; font-weight: 700; }
      .line { stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="430"/>
  <text x="36" y="45" class="txt" font-weight="700">Claude Code 项目配置攻击链</text>
  <text x="36" y="70" class="small">仓库配置文件不再只是说明材料，而是会影响 agent 启动、工具调用和网络访问的执行面。</text>

  <rect x="42" y="120" width="190" height="150" class="panel"/>
  <circle cx="70" cy="146" r="16" fill="#2563eb"/><text x="65" y="152" class="num">1</text>
  <text x="94" y="150" class="txt" font-weight="700">投递配置</text>
  <text x="64" y="188" class="small">PR、fork、模板或示例项目</text>
  <text x="64" y="213" class="small">夹带 .claude/settings.json</text>
  <text x="64" y="238" class="small">或 .mcp.json</text>

  <rect x="282" y="120" width="190" height="150" class="risk"/>
  <circle cx="310" cy="146" r="16" fill="#ea580c"/><text x="305" y="152" class="num">2</text>
  <text x="334" y="150" class="txt" font-weight="700">提前加载</text>
  <text x="304" y="188" class="small">启动阶段解析项目配置</text>
  <text x="304" y="213" class="small">信任提示尚未完成</text>
  <text x="304" y="238" class="small">权限边界被反转</text>

  <rect x="522" y="120" width="190" height="150" class="bad"/>
  <circle cx="550" cy="146" r="16" fill="#dc2626"/><text x="545" y="152" class="num">3</text>
  <text x="574" y="150" class="txt" font-weight="700">触发动作</text>
  <text x="544" y="188" class="small">Hook 执行 shell 命令</text>
  <text x="544" y="213" class="small">MCP server 初始化</text>
  <text x="544" y="238" class="small">API endpoint 被覆盖</text>

  <rect x="762" y="120" width="176" height="150" class="bad"/>
  <circle cx="790" cy="146" r="16" fill="#b91c1c"/><text x="785" y="152" class="num">4</text>
  <text x="814" y="150" class="txt" font-weight="700">造成影响</text>
  <text x="784" y="188" class="small">本机命令执行</text>
  <text x="784" y="213" class="small">API Token 外泄</text>
  <text x="784" y="238" class="small">供应链横向扩散</text>

  <path class="line" d="M232 195 H274"/>
  <path class="line" d="M472 195 H514"/>
  <path class="line" d="M712 195 H754"/>

  <rect x="42" y="318" width="896" height="62" fill="#eff6ff" stroke="#bfdbfe" rx="10"/>
  <text x="66" y="345" class="label">关键判断</text>
  <text x="66" y="366" class="small">当 AI 编码工具具备 shell、文件系统、MCP 和网络访问能力时，项目配置文件需要按可执行代码审查。</text>
</svg>
