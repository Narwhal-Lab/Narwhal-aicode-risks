            <div class='post' itemprop="text">
              <p>JupyterLab v4.5.7 and Notebook v7.5.6 are out on PyPI and conda-forge, including three security fixes:</p>
<ul>
<li>CVE-2026-42266 <a href="https://github.com/jupyterlab/jupyterlab/security/advisories/GHSA-37w4-hwhx-4rc4" rel="noopener nofollow ugc">GHSA-37w4-hwhx-4rc4</a> Allowlist for PyPI Extension Manager not correctly enforced, PyPI Extension Manager not limited to default PyPI index</li>
<li>CVE-2026-42557 <a href="https://github.com/jupyterlab/jupyterlab/security/advisories/GHSA-mqcg-5x36-vfcg" rel="noopener nofollow ugc">GHSA-mqcg-5x36-vfcg</a> Command linker attributes in HTML enable one-click command execution from untrusted content</li>
<li>CVE-2026-40171 <a href="https://github.com/jupyter/notebook/security/advisories/GHSA-rch3-82jr-f9w9" rel="noopener nofollow ugc">GHSA-rch3-82jr-f9w9</a> Command linker attributes chained with help command enable one-click authentication token theft</li>
</ul>
