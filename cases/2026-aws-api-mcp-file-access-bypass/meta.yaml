slug: 2026-aws-api-mcp-file-access-bypass
title_en: AWS API MCP Server File Access Restriction Bypass
title_cn: AWS API MCP Server 文件访问限制绕过漏洞
year: 2026
disclosed: '2026-03-16'
category: cloud-iac
severity: high
severity_basis: cvss
severity_evidence: AWS confirmed CVE-2026-4270 in aws-api-mcp-server versions 0.2.14 through 1.3.8. The no-access and workdir controls could be bypassed to expose arbitrary local file content to an MCP client context.
real_incident: true
reproducible: true
