severity_evidence: "CVE-2026-42208 is a critical pre-authentication SQL injection in LiteLLM Proxy versions 1.81.16 through 1.83.6. Public advisories and technical reports state that crafted Authorization headers could reach the API key verification query and expose LiteLLM virtual keys, stored provider credentials, and configuration data; Sysdig reported targeted exploitation attempts within about 36 hours of public disclosure."
