verification_notes: The traffic-capture finding was reported by independent researchers and corroborated by The Hacker News, Axios, Simon Willison, and later source-code inspection. xAI's public pages establish the product context; public reporting says xAI changed a server-side setting and announced deletion, but does not prove retrospective deletion or identify all affected users.
