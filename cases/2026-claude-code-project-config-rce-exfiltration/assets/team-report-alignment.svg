<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">Alignment with team technical report</title>
  <desc id="desc">A mapping diagram connecting the Claude Code case to risk categories and mitigations in the team technical report.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .center { fill: #0f172a; rx: 12; }
      .node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; rx: 10; }
      .risk { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.4; rx: 10; }
      .gov { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.4; rx: 10; }
      .txt { font-family: Arial, "Noto Sans SC", sans-serif; fill: #0f172a; font-size: 16px; }
      .white { font-family: Arial, "Noto Sans SC", sans-serif; fill: #f8fafc; font-size: 17px; font-weight: 700; }
      .small { font-family: Arial, "Noto Sans SC", sans-serif; fill: #475569; font-size: 13px; }
      .line { stroke: #94a3b8; stroke-width: 1.8; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="980" height="470"/>
  <text x="36" y="42" class="txt" font-weight="700" font-size="22">与团队技术报告的风险映射</text>
  <text x="36" y="68" class="small">Claude Code 案例把报告中的风险类别落到了一个真实的 agentic coding tool 攻击链上。</text>

  <rect x="370" y="170" width="240" height="105" class="center"/>
  <text x="405" y="210" class="white">Claude Code 项目配置缺陷</text>
  <text x="405" y="238" fill="#cbd5e1" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14">hooks / MCP / API endpoint</text>

  <path class="line" d="M370 205 C260 170 220 120 190 105"/>
  <path class="line" d="M370 245 C260 275 220 332 190 350"/>
  <path class="line" d="M610 205 C720 170 760 120 790 105"/>
  <path class="line" d="M610 245 C720 275 760 332 790 350"/>

  <rect x="44" y="82" width="250" height="86" class="risk"/>
  <text x="66" y="116" class="txt" font-weight="700">漏洞注入与放大</text>
  <text x="66" y="142" class="small">agent 拥有本地执行权</text>

  <rect x="44" y="318" width="250" height="86" class="risk"/>
  <text x="66" y="352" class="txt" font-weight="700">敏感数据泄露</text>
  <text x="66" y="378" class="small">API Token 在初始化阶段外泄</text>

  <rect x="686" y="82" width="250" height="86" class="risk"/>
  <text x="708" y="116" class="txt" font-weight="700">供应链风险</text>
  <text x="708" y="142" class="small">恶意配置随仓库传播</text>

  <rect x="686" y="318" width="250" height="86" class="gov"/>
  <text x="708" y="352" class="txt" font-weight="700">零信任治理</text>
  <text x="708" y="378" class="small">沙箱、最小权限、出口审计</text>

  <rect x="334" y="332" width="312" height="72" fill="#eff6ff" stroke="#bfdbfe" rx="10"/>
  <text x="360" y="362" class="txt" font-weight="700">评测启示</text>
  <text x="360" y="386" class="small">AICGSecEval 应覆盖配置投毒和信任提示顺序测试</text>
</svg>
